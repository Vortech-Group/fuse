<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t">
  <title id="t">Laravel Fuse by Vortech</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <linearGradient id="burn" gradientUnits="userSpaceOnUse" x1="24" y1="0" x2="360" y2="0">
      <stop offset="0" stop-color="#575856"/>
      <stop offset="1" stop-color="#CF000F"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="#08090a"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect x="0" y="0" width="6" height="400" fill="#CF000F"/>

  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="128" fill="#8b8c8a" font-size="18" font-weight="600" letter-spacing="4">VORTECH  /  LARAVEL PACKAGE</text>
    <text x="80" y="212" fill="#f4f4f2" font-size="72" font-weight="800" letter-spacing="-2">Laravel <tspan fill="#CF000F">Fuse</tspan></text>
    <text x="80" y="266" fill="#8b8c8a" font-size="24">Put an expiration date</text>
    <text x="80" y="300" fill="#8b8c8a" font-size="24">on temporary code.</text>
  </g>

  <!-- code + check mock -->
  <g transform="translate(750,56)" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16">
    <rect width="470" height="288" rx="12" fill="#0c0d0e" stroke="#575856" stroke-opacity=".6"/>
    <rect width="470" height="40" rx="12" fill="#ffffff" fill-opacity=".04"/>
    <circle cx="24" cy="20" r="5" fill="#575856"/>
    <circle cx="42" cy="20" r="5" fill="#575856"/>
    <circle cx="60" cy="20" r="5" fill="#575856"/>

    <text x="24" y="76" fill="#8b8c8a">#[<tspan fill="#f4f4f2">Fuse</tspan>(</text>
    <text x="48" y="100" fill="#8b8c8a">reason: <tspan fill="#f4f4f2">'Legacy NAV v3 layer'</tspan>,</text>
    <text x="48" y="124" fill="#8b8c8a">expires: <tspan fill="#CF000F">'2026-12-01'</tspan>,</text>
    <text x="24" y="148" fill="#8b8c8a">)]</text>

    <!-- burning fuse -->
    <line x1="24" y1="172" x2="446" y2="172" stroke="#575856" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="172" x2="360" y2="172" stroke="url(#burn)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="360" cy="172" r="7" fill="#CF000F"/>
    <circle cx="360" cy="172" r="13" fill="#CF000F" fill-opacity=".25"/>

    <text x="24" y="212" fill="#f4f4f2">$ php artisan fuse:check</text>
    <text x="24" y="240" fill="#8b8c8a"><tspan fill="#f4f4f2">18</tspan> active   <tspan fill="#f4f4f2">3</tspan> expiring   <tspan fill="#CF000F">2</tspan> expired</text>
    <rect x="24" y="252" width="62" height="24" rx="12" fill="#CF000F"/>
    <text x="55" y="269" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">FAIL</text>
    <text x="100" y="269" fill="#575856" font-size="14">exit code 1</text>
  </g>
</svg>
